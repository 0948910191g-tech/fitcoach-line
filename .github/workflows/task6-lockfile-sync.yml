name: Task 6 Lockfile Sync

on:
  push:
    branches: [feat/ai-gateway-worker]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/ai-gateway-worker

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile and remove one-shot workflow
        run: |
          rm .github/workflows/task6-lockfile-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/task6-lockfile-sync.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: sync task 6 workspace lockfile"
          git push origin HEAD:feat/ai-gateway-worker
