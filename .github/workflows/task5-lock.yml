name: Task 5 lock generation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lock:
    if: github.head_ref == 'build/task5-supabase-lock'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Generate exact dependency lock
        run: pnpm --filter @fitcoach/web add --save-exact @supabase/supabase-js@2.112.3 @supabase/ssr@0.12.4
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile
      - name: Export generated dependency files
        uses: actions/upload-artifact@v4
        with:
          name: task5-supabase-lock
          path: |
            apps/web/package.json
            pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
