name: Task 5 lock generation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lock:
    if: github.head_ref == 'build/task5-supabase-lock'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Generate exact dependency lock
        run: pnpm --filter @fitcoach/web add --save-exact @supabase/supabase-js@2.112.3 @supabase/ssr@0.12.4
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile
      - name: Export generated files to log
        run: |
          echo 'PACKAGE_JSON_BASE64_BEGIN'
          base64 -w0 apps/web/package.json
          echo
          echo 'PACKAGE_JSON_BASE64_END'
          echo 'PNPM_LOCK_GZIP_BASE64_BEGIN'
          gzip -c pnpm-lock.yaml | base64 -w0
          echo
          echo 'PNPM_LOCK_GZIP_BASE64_END'
