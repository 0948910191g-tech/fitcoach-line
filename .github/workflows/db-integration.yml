name: DB Integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}

      - name: Initialize and start disposable Supabase
        run: |
          supabase init
          supabase start >/dev/null

      - name: Run DB integration tests
        run: |
          eval "$(supabase status -o env \
            --override-name api.url=SUPABASE_TEST_URL \
            --override-name auth.anon_key=SUPABASE_TEST_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_TEST_SERVICE_ROLE_KEY \
            --override-name auth.jwt_secret=SUPABASE_TEST_JWT_SECRET)"
          export SUPABASE_TEST_URL SUPABASE_TEST_ANON_KEY SUPABASE_TEST_SERVICE_ROLE_KEY SUPABASE_TEST_JWT_SECRET
          pnpm --filter @fitcoach/db test -- \
            repositories.integration.test.ts \
            line-event-ingestion.integration.test.ts \
            onboarding-rls.integration.test.ts
