name: Task 7 lockfile sync

on:
  push:
    branches:
      - feat/codex-provider

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/codex-provider
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate and verify lockfile
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
      - name: Commit lockfile and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/task7-lockfile-sync.yml
          git commit -m "build(ai): sync codex sdk lockfile"
          git push origin HEAD:feat/codex-provider
