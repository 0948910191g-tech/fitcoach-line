name: Task 7 Lockfile Sync

on:
  push:
    branches:
      - feat/codex-provider

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/codex-provider

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate workspace lockfile
        run: |
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile

      - name: Commit lockfile and remove temporary workflow
        run: |
          rm .github/workflows/task7-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/task7-lockfile.yml
          git diff --cached --check
          git commit -m "chore: sync task 7 workspace lockfile"
          git push origin HEAD:feat/codex-provider
